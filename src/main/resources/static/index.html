<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loan default risk</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 560px; margin: 2rem auto; padding: 0 1rem; color: #1b2a2f; }
  h1 { font-size: 1.5rem; margin-bottom: .25rem; }
  p.hint { color: #5b6b70; margin-top: 0; }
  label { display: block; margin: .8rem 0 .2rem; font-size: .9rem; }
  input, select { width: 100%; padding: .5rem; font-size: 1rem; border: 1px solid #aab6b9; border-radius: 6px; box-sizing: border-box; }
  button { margin-top: 1.2rem; padding: .65rem 1.2rem; font-size: 1rem; background: #0f5c63; color: #fff; border: 0; border-radius: 6px; cursor: pointer; }
  button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid #e0a030; }
  #result { margin-top: 1.2rem; font-size: 1.3rem; }
  .low { color: #1c7a43; } .mid { color: #9a6a00; } .high { color: #b3261e; }
</style>
</head>
<body>
<h1>Loan default risk</h1>
<p class="hint">Enter the borrower's details. Empty fields are treated as unknown.</p>
<div id="form">Loading form…</div>
<button id="go" hidden>Check risk</button>
<div id="result" role="status"></div>
<script>
const form = document.getElementById("form"), result = document.getElementById("result"), go = document.getElementById("go");
let fields = [];
fetch("/schema").then(r => r.ok ? r.json() : r.json().then(e => Promise.reject(e.message)))
  .then(f => {
    fields = f; form.innerHTML = "";
    f.forEach(x => {
      const l = document.createElement("label"); l.textContent = x.name; l.htmlFor = x.name;
      let el;
      if (x.type === "nominal") {
        el = document.createElement("select");
        el.add(new Option("(unknown)", ""));
        x.values.forEach(v => el.add(new Option(v, v)));
      } else { el = document.createElement("input"); el.type = "number"; el.step = "any"; }
      el.id = x.name; form.append(l, el);
    });
    go.hidden = false;
  })
  .catch(e => form.textContent = "Could not load the model: " + e);
go.onclick = async () => {
  const body = {}; fields.forEach(x => body[x.name] = document.getElementById(x.name).value);
  const r = await fetch("/predict", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)});
  const j = await r.json();
  if (!r.ok) { result.className = "high"; result.textContent = j.message || "Something went wrong"; return; }
  const p = j.defaultRisk * 100;
  result.className = p < 20 ? "low" : p < 50 ? "mid" : "high";
  result.textContent = "Default risk: " + p.toFixed(1) + "%";
};
</script>
</body>
</html>
